<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系规知识点背记工具</title>
<style>
:root{
  --blue:#2563eb; --blue2:#3b82f6; --blue-light:#eff4ff; --navy:#1e3a8a;
  --green:#16a34a; --red:#dc2626; --orange:#ea580c; --gray:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f8ff;color:#1e293b;min-height:100vh;}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;}
.brand h1{font-size:20px;color:var(--navy);}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;background:#e2e8f0;color:#334155;transition:.15s;}
.btn:hover{filter:brightness(.96);}
.btn.primary{background:var(--blue);color:#fff;}
.btn.ghost{background:#fff;border:1px solid var(--border);}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.18s;}
.card:hover{box-shadow:0 6px 18px rgba(37,99,235,.12);transform:translateY(-2px);border-color:var(--blue2);}
.card .ch-no{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:6px;}
.card .ch-title{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.4;}
.card .cnt{font-size:12px;color:var(--gray);margin-bottom:8px;}
.bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:4px;transition:width .3s;}
.bar.full>i{background:linear-gradient(90deg,#16a34a,#4ade80);}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-top:5px;}
.subnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.mode-tabs{display:flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px;}
.mode-tabs button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;color:#475569;}
.mode-tabs button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.seg{display:flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px;margin-left:auto;}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:#475569;}
.seg button.on{background:#fff;color:var(--blue);font-weight:600;}
.qcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 18px;margin-bottom:16px;}
.qhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.qtext{font-size:16px;font-weight:600;line-height:1.5;flex:1;min-width:200px;}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:600;}
.b-must{background:#fee2e2;color:var(--red);}
.b-key{background:#ffedd5;color:var(--orange);}
.b-try{background:#dbeafe;color:var(--blue);}
.hint{font-size:13px;color:var(--gray);margin-bottom:12px;line-height:1.6;}
.blk-line{display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.8;margin:7px 0;flex-wrap:wrap;}
.blk-line .no{color:var(--gray);font-size:13px;min-width:20px;text-align:right;}
.blk-input{width:110px;padding:5px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#f8fafc;color:#1e293b;}
.blk-input:focus{outline:none;border-color:var(--blue);background:#fff;}
.blk-input.ok{border-color:#16a34a;background:#f0fdf4;color:#166534;}
.blk-input.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b;}
.group-title{font-size:13px;font-weight:600;color:var(--blue);margin:10px 0 2px;}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.answer{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin-top:14px;}
.answer .t{font-size:13px;font-weight:600;color:var(--green);margin-bottom:8px;}
.answer ol{margin-left:20px;}
.answer li{font-size:14px;line-height:1.8;}
.qnav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.qnav .nums{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.num{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;color:#334155;display:flex;align-items:center;justify-content:center;}
.num.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.num.done{background:#dcfce7;border-color:#86efac;color:#166534;}
.recall-area{display:flex;flex-direction:column;gap:8px;}
.recall-input{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#f8fafc;resize:vertical;min-height:38px;line-height:1.5;}
.recall-input:focus{outline:none;border-color:var(--blue);background:#fff;}
.recall-input.ok{border-color:#16a34a;background:#f0fdf4;}
.recall-input.bad{border-color:#dc2626;background:#fef2f2;}
.recall-line{display:flex;align-items:flex-start;gap:8px;}
.recall-line .no{font-size:13px;color:var(--gray);padding-top:9px;min-width:22px;text-align:right;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
.stat .v{font-size:26px;font-weight:700;color:var(--blue);}
.stat .v.green{color:#16a34a;} .stat .v.red{color:#dc2626;} .stat .v.orange{color:var(--orange);}
.stat .k{font-size:12px;color:var(--gray);margin-top:4px;}
.summ-list{background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 14px;}
.summ-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f1f5f9;font-size:14px;}
.summ-item:last-child{border-bottom:none;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot.ok{background:#16a34a;} .dot.no{background:#cbd5e1;}
.empty{text-align:center;color:var(--gray);padding:40px 0;font-size:14px;}
.small-text{font-size:12px;color:var(--gray);}
/* 卡片背记 */
.card-wrap{display:flex;justify-content:center;}
.flip-card{perspective:1400px;cursor:pointer;width:100%;max-width:640px;}
.flip-inner{position:relative;width:100%;min-height:380px;transition:transform .55s;transform-style:preserve-3d;}
.flip-inner.flipped{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;}
.flip-front{background:#fff;border:1px solid var(--border);box-shadow:0 10px 30px rgba(37,99,235,.10);}
.flip-back{background:var(--navy);border:1px solid var(--navy);color:#fff;transform:rotateY(180deg);box-shadow:0 10px 30px rgba(30,58,138,.25);}
.card-badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600;margin-bottom:16px;}
.card-q{font-size:20px;font-weight:700;line-height:1.6;text-align:center;color:#1e293b;max-width:90%;}
.flip-back .card-q{color:#fff;padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed rgba(191,219,254,.35);}
.card-tip{font-size:13px;color:var(--gray);margin-top:20px;text-align:center;}
.flip-back .card-tip{color:#bfdbfe;}
.card-ans{width:100%;max-width:92%;margin-top:6px;}
.card-ans .ans-title{font-size:14px;font-weight:600;color:#bfdbfe;margin-bottom:10px;text-align:center;}
.card-ans ol{margin-left:22px;}
.card-ans li{font-size:15px;line-height:1.9;}
.card-ans li b{color:#93c5fd;}
.card-nav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.card-nav .nums{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
/* 序号按重要度着色 */
.num.n-must{border-color:#fca5a5;background:#fef2f2;color:#b91c1c;}
.num.n-key{border-color:#fdba74;background:#fff7ed;color:#c2410c;}
.num.n-try{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8;}
.num.n-must.on{background:#dc2626;color:#fff;border-color:#dc2626;}
.num.n-key.on{background:#ea580c;color:#fff;border-color:#ea580c;}
.num.n-try.on{background:#2563eb;color:#fff;border-color:#2563eb;}
@media(max-width:600px){ .wrap{padding:14px 10px 70px;} .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));} .flip-inner{min-height:320px;} .card-q{font-size:17px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" id="brandHome">
      <div class="logo">系</div>
      <h1>系规知识点背记工具</h1>
    </div>
  </div>

  <!-- 首页 -->
  <div id="homeView">
    <div id="homeStats" style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div style="font-size:13px;color:var(--gray);white-space:nowrap;">总体掌握度</div>
      <div style="flex:1;min-width:120px;"><div class="bar"><i id="globalBar"></i></div></div>
      <div class="small-text" id="globalText" style="white-space:nowrap;"></div>
      <button class="btn primary" id="openCardHome">🃏 打开背记卡片</button>
    </div>
    <div class="grid" id="chapterGrid"></div>
  </div>

  <!-- 分组选择页 -->
  <div id="groupView" style="display:none">
    <div class="subnav">
      <button class="btn ghost" id="backFromGroup">← 返回章节列表</button>
      <span id="groupChTitle" style="font-weight:700;font-size:16px;"></span>
    </div>
    <div class="grid" id="groupGrid"></div>
  </div>

  <!-- 章节页 -->
  <div id="chapterView" style="display:none">
    <div class="subnav">
      <button class="btn ghost" id="backHome">← 返回章节列表</button>
      <span id="chTitle" style="font-weight:700;font-size:16px;"></span>
      <div class="mode-tabs">
        <button data-mode="blank" class="on">填空题</button>
        <button data-mode="recall">默写题</button>
        <button data-mode="summary">汇总</button>
      </div>
      <div class="seg" id="filterSeg">
        <button data-f="all" class="on">全部</button>
        <button data-f="miss">仅未掌握</button>
      </div>
    </div>

    <div id="blankView">
      <div class="qnav"><div class="nums" id="blankNums"></div></div>
      <div class="qcard" id="blankCard"></div>
    </div>
    <div id="recallView" style="display:none">
      <div class="qnav"><div class="nums" id="recallNums"></div></div>
      <div class="qcard" id="recallCard"></div>
    </div>
    <div id="summaryView" style="display:none">
      <div class="stat-grid" id="summaryStats"></div>
      <div class="actions" style="margin-bottom:14px;">
        <button class="btn primary" id="goMissBlank">只背未掌握的（填空题）</button>
        <button class="btn primary" id="goMissRecall">只背未掌握的（默写题）</button>
        <button class="btn" id="resetChBtn">重置本章进度</button>
      </div>
      <div class="summ-list" id="summaryList"></div>
    </div>
  </div>

  <!-- 卡片背记：章节选择 -->
  <div id="cardHomeView" style="display:none">
    <div class="subnav">
      <button class="btn ghost" id="backCardHome">← 返回答题首页</button>
      <span style="font-weight:700;font-size:16px;">背记卡片 · 选择章节</span>
    </div>
    <div class="grid" id="cardChapterGrid"></div>
  </div>

  <!-- 卡片背记：分组选择 -->
  <div id="cardGroupView" style="display:none">
    <div class="subnav">
      <button class="btn ghost" id="backCardGroup">← 返回章节选择</button>
      <span id="cardGroupChTitle" style="font-weight:700;font-size:16px;">背记卡片 · 选择分组</span>
    </div>
    <div class="grid" id="cardGroupGrid"></div>
  </div>

  <!-- 卡片背记：学习 -->
  <div id="cardStudyView" style="display:none">
    <div class="subnav">
      <button class="btn ghost" id="backCardCh">← 返回章节选择</button>
      <span id="cardChTitle" style="font-weight:700;font-size:16px;"></span>
      <div class="seg" id="cardReqSeg">
        <button data-req="all" class="on">全部</button>
        <button data-req="必须背">必须背</button>
        <button data-req="重点背">重点背</button>
        <button data-req="尽量背">尽量背</button>
      </div>
    </div>
    <div class="qnav"><div class="nums" id="cardNums"></div></div>
    <div class="qcard" id="flipCard"></div>
  </div>
</div>

<script>
// 第4章 信息系统规划
const CH4 = {
  id: 4,
  title: '第4章 信息系统规划',
  items: [
    {q: '信息系统规划的价值与意义？', req: '尽量背', ans: ['确立组织关键数字能力目标','明确组织数字能力建设路径','确保数字能力建设认识上的一致性','具象数字能力建设的关键任务','明确数字能力标准与控制措施','统筹部署与管理相关建设资源']},
    {q: '信息系统规划的原则？', req: '尽量背', ans: ['战略性','整体性','先进性','指导性']},
    {q: '信息系统规划的主要内容？', req: '必须背', ans: ['信息系统发展战略','主要系统及框架','组织体系优化','技术体系定义','任务体系部署','资源体系调度','保障体系设定']},
    {q: '选择信息系统发展路径的基本原则？', req: '尽量背', ans: ['业务一致','能力主线','基础优先','稳态先行']},
    {q: '信息系统规划的框架？', req: '尽量背', ans: ['以应用功能为主线的框架','以平台能力为主线的框架','以互联网为主线的框架']},
    {q: '分系统划分的原则？', req: '尽量背', ans: ['技术一致性','工程一致性','职能一致性','数据一致性']},
    {q: '大型单位的信息组织体系？', req: '尽量背', ans: ['集中式','分权式','平衡矩阵式']},
    {q: '选择和确立技术体系的基本原则？', req: '尽量背', ans: ['可用性原则','安全性原则','可靠性原则','灵活性原则','可扩展性原则','可驾驭性原则']},
    {q: '任务体系部署的主要过程？', req: '重点背', ans: ['任务拆解','明确目标','资源配置','制定策略','定义计划','监控实施']},
    {q: '资源体系调度的内容？', req: '重点背', ans: ['资源识别与评估','资源关系与控制','资源分配与调度','资源风险与优化']},
    {q: '保障体系设定的内容？', req: '重点背', ans: ['组织保障','人员保障','技术保障','资源保障','数据保障','安全保障']},
    {q: '信息系统规划的工作要点？', req: '必须背', ans: ['内外部需求挖掘','场景化模型分析','深度诊断与评估','整体与专项规划','持续改进']},
    {q: '内部需求挖掘的主要工作任务？', req: '重点背', ans: ['理解组织战略','熟悉业务流程','收集用户需求','评估现有系统','感知数字环境']},
    {q: '内部需求挖掘的注意事项？', req: '尽量背', ans: ['以原始信息获取为主','避免直接给出解决方案','及时开展引导性培训','谨慎信息交叉传递','关注隐性需求的推演']},
    {q: '外部需求挖掘的主要工作任务？', req: '重点背', ans: ['国家战略导入','行业趋势分析','技术趋势研究','竞争环境分析','客户期望调研','标准与规范引用']},
    {q: '外部需求挖掘的注意事项？', req: '尽量背', ans: ['国家战略与政策引用','定性内容转定量对比','避免信息安全事件']},
    {q: '场景模型的主要组成部分？', req: '重点背', ans: ['场景定义','角色分析','业务分析','数据分析','技术分析','组织分析','风险分析','政策与法律分析']},
    {q: '场景化模型分析的关键价值？', req: '尽量背', ans: ['提高规划决策的科学性和实践性','确保规划与组织发展的衔接','降低规划风险和成本','促进信息系统规划的共识和沟通']},
    {q: '场景化模型分析的优缺点？', req: '尽量背', groups: [
      {g: '优点', items: ['贴近实际需求','提供指导和参考','提高系统适应性']},
      {g: '缺点', items: ['数据采集和分析困难','可行性限制']}
    ]},
    {q: '深度诊断与评估的内容？', req: '尽量背', ans: ['成熟度与需求控制','诊断与评估模型确立','诊断与评估实施']},
    {q: '整体与专项规划阶段的工作内容？', req: '重点背', ans: ['需求整合与确认','整体规划','专项规划','一致性检查']},
    {q: '需求整合的维度？', req: '尽量背', ans: ['业务领域维需求整合','能力建设维需求整合','技术发展维需求整合']},
    {q: '整体规划重点关注的内容？', req: '尽量背', ans: ['确保信息系统与组织战略目标的一致性','提高信息系统的协同性和一体化程度','优化资源配置和投资回报']},
    {q: '专项规划的内容？', req: '尽量背', ans: ['应用系统规划','网络环境规划','云服务规划','数据中心规划','信息安全规划','云原生系统规划']},
    {q: '专项规划重点关注的内容？', req: '尽量背', ans: ['需要清晰明确信息系统的管理和使用主体','强调单项领域的规划系统性','技术路线和技术属性需要进一步明确和强化','需要配套更加细致的实施路径或计划']},
    {q: '信息系统规划持续改进需要关注的内容？', req: '尽量背', ans: ['持续跟踪组织的战略','感知技术的发展创新','关注数据管理和信息安全','注重用户体验和用户参与','建立一个监测和评估机制']},
    {q: '信息系统规划的常用方法？', req: '重点背', ans: ['战略目标集转移法','企业信息系统规划法','关键成功因素法','价值链分析法','Zachman框架']},
    {q: '战略目标集转移法中信息系统战略规划过程的步骤？', req: '尽量背', ans: ['识别和解释组织战略集','进一步解释和验证组织战略集']},
    {q: '企业信息系统规划法的基本步骤？', req: '尽量背', ans: ['定义管理目标','定义管理功能','定义数据类','定义信息结构']},

const $=s=>document.querySelector(s);
const PROGRESS_KEY='xisu_progress_v2';
const CHAPTERS=[CH4,CH5,CH6,CH7,CH8,CH9,CH10,CH11,CH12,CH13,CH14,CH15,CH16,CH17];

function loadProgress(){try{return JSON.parse(localStorage.getItem(PROGRESS_KEY))||{};}catch(e){return {};}}
function saveProgress(p){localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}
const progress=loadProgress();

function chProg(cid){if(!progress[cid])progress[cid]={};return progress[cid];}
function isMastered(cid,idx){return chProg(cid)[idx]===1;}
function setMastered(cid,idx,v){chProg(cid)[idx]=v?1:0;saveProgress(progress);}
function chStat(cid){
  const ch=CHAPTERS.find(c=>c.id===cid);
  let total=ch.items.length,mastered=0;
  ch.items.forEach((_,i)=>{if(isMastered(cid,i))mastered++;});
  return {total,mastered};
}
function curChapter(){return CHAPTERS.find(c=>c.id===curChapterId);}
function badgeCls(req){return req==='必须背'?'b-must':(req==='重点背'?'b-key':'b-try');}

function norm(s){return (s||'').replace(/\s+/g,'').replace(/[，。、；：,.？?！!（）()【】\[\]《》<>“”"'\"'：:]/g,'').toLowerCase();}
function checkInput(input,answer,strict){
  const a=norm(input),b=norm(answer);
  if(!a)return false;
  const eq=a===b||a.includes(b)||b.includes(a);
  if(strict||b.length<=3)return eq;
  if(eq)return true;
  const sa=new Set(a),sb=new Set(b);let hit=0;
  sb.forEach(c=>{if(sa.has(c))hit++;});
  return hit/Math.max(sb.size,1)>=0.8;
}

/* 答案条目化：支持分组 */
function itemAns(item){
  if(item.ans)return item.ans.map(t=>({t}));
  const out=[];
  (item.groups||[]).forEach(g=>{g.items.forEach(t=>out.push({t,g:g.g}));});
  return out;
}

/* 填空出题：优先挖完整词，避免截断（如"服务"只留"服"） */
function pickKeyword(ans){
  // 1. 按标点和虚词切分，收集2-4字片段
  const parts=ans.split(/[，。、；：,.？?！!（）()【】\[\]《》<>“”'""'：:／/＝=＋+\-的与及或等并可以·]/);
  const cands=[];
  for(const p of parts){const t=p.trim();if(t.length>=2&&t.length<=4)cands.push(t);}
  // 2. 领域术语：0-2字前缀+常见后缀（管理/过程/设计…）
  const sfxRe=/[\u4e00-\u9fa5]{0,2}(管理|过程|设计|规划|分析|评估|控制|监控|保障|改进|测量|回顾|活动|要素|工具|方法|原则|内容|步骤|流程|目标|指标|范围|阶段|分类|标准|模型|架构|框架|安全|服务|需求|能力|绩效|培训|报告|计划|清单|定义|识别|检查|审计|战略|策略|机制|体系|治理|资源|预算|核算|结算|收益|效率|风险|维护|提升|评价|转移|清除|销毁|回收|处置|终止|移交|验收|演练|推演|沟通|调查|总结|反馈)/g;
  const sfxM=ans.match(sfxRe);
  if(sfxM)sfxM.forEach(m=>{if(m.length>=2&&m.length<=4)cands.push(m);});
  // 3. 英文术语
  const enM=ans.match(/[A-Za-z][A-Za-z0-9]{1,}|[A-Z]{2,}/g);
  if(enM)enM.forEach(m=>{if(m.length>=2&&m.length<=6)cands.push(m);});
  // 去重并随机选取
  const unique=[...new Set(cands.filter(c=>c.length>=2&&c.length<=4&&ans.includes(c)))];
  if(unique.length)return unique[Math.floor(Math.random()*unique.length)];
  // 兜底
  const re=/[\u4e00-\u9fa5]{2,3}/g;
  const toks=ans.match(re);
  if(!toks||!toks.length)return null;
  return toks[Math.floor(Math.random()*toks.length)];
}
function makeBlank(word){
  const kw=pickKeyword(word);
  if(!kw){
    // 没有可挖词：挖行首2字
    return {html:word.replace(/^(.{1,2})/,'<input class="blk-input" placeholder="填写">'),answer:word.slice(0,2)};
  }
  const idx=word.indexOf(kw);
  // 挖掉该词，其余内容全部保留
  const html=word.slice(0,idx)+'<input class="blk-input" data-i="" placeholder="填写" autocomplete="off">'+word.slice(idx+kw.length);
  return {html,answer:kw};
}

/* ===== 填空题 ===== */
function renderBlank(){
  const list=filteredItems();
  $('#blankNums').innerHTML=list.map((idx,i)=>{
    const on=i===blankPos?'on':'';
    const st=isMastered(curChapterId,idx)?'done':'';
    return `<button class="num ${on} ${st}" data-bp="${i}">${i+1}</button>`;
  }).join('');
  if(!list.length){
    $('#blankCard').innerHTML=`<div class="empty">${filter==='miss'?'本章全部掌握，无需再背！':'本章暂无知识点。'}</div>`;
    return;
  }
  if(blankPos>=list.length)blankPos=0;
  const idx=list[blankPos];
  if(!blankCard||blankCard.idx!==idx){
    const item=curChapter().items[idx];
    const ansList=itemAns(item);
    blankCard={idx,blanks:ansList.map(a=>makeBlank(a.t))};
  }
  renderBlankCard();
}
function renderBlankCard(){
  const item=curChapter().items[blankCard.idx];
  const ansList=itemAns(item);
  let html='';
  ansList.forEach((a,i)=>{
    const b=blankCard.blanks[i];
    if(a.g)html+=`<div class="group-title">${a.g}</div>`;
    html+=`<div class="blk-line"><span class="no">${i+1}.</span>${b.html}</div>`;
  });
  $('#blankCard').innerHTML=`
    <div class="qhead">
      <span class="qtext">【问${blankCard.idx+1}】${item.q}</span>
      <span class="badge ${badgeCls(item.req)}">${item.req}</span>
    </div>
    <div class="hint">共 ${ansList.length} 个要点 · 每行随机挖空一个关键词，点击「换题」可重新出题。<b style="color:var(--blue)">填空仅帮助记忆，不记录掌握状态；掌握与否以默写题为准。</b></div>
    <div>${html}</div>
    <div class="actions">
      <button class="btn primary" id="submitBlank">提交答案</button>
      <button class="btn" id="redoBlank">换题</button>
      <button class="btn ghost" id="showAnsBlank">显示正确答案</button>
      <button class="btn ghost" id="prevBlank">上一题</button>
      <button class="btn ghost" id="nextBlank">下一题</button>
    </div>
    <div id="blankResult"></div>`;
  // 重新生成 blank 里的输入框 i 序号
  $('#blankCard').querySelectorAll('.blk-input').forEach((inp,di)=>{inp.dataset.i=di;});
  $('#submitBlank').onclick=()=>judgeBlank();
  $('#redoBlank').onclick=()=>{
    const ansList=itemAns(item);
    blankCard.blanks=ansList.map(a=>makeBlank(a.t));
    renderBlankCard();
  };
  $('#showAnsBlank').onclick=()=>{
    $('#blankResult').innerHTML=`<div class="answer"><div class="t">正确答案：</div><ol>${ansList.map(a=>`<li>${a.t}</li>`).join('')}</ol></div>`;
  };
  $('#prevBlank').onclick=()=>{if(blankPos>0){blankPos--;blankCard=null;renderBlank();}};
  $('#nextBlank').onclick=()=>{const list=filteredItems();if(blankPos<list.length-1){blankPos++;blankCard=null;renderBlank();}};
}
function judgeBlank(){
  const item=curChapter().items[blankCard.idx];
  const ansList=itemAns(item);
  let allOk=true,cnt=0;
  $('#blankCard').querySelectorAll('.blk-input').forEach(inp=>{
    const i=+inp.dataset.i;
    const ok=checkInput(inp.value,blankCard.blanks[i].answer,false);
    inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);
    if(ok)cnt++;else allOk=false;
  });
  $('#blankResult').innerHTML=`<div class="answer"><div class="t">${allOk?'全部正确！':'正确 '+cnt+'/'+ansList.length+' 个，正确答案：'}</div><ol>${ansList.map((a,i)=>`<li><b style="color:#2563eb">${blankCard.blanks[i].answer}</b> — ${a.t}</li>`).join('')}</ol><div class="t" style="color:var(--gray);margin-top:6px;font-weight:400;">填空题仅作记忆练习，不记录掌握状态；掌握与否以默写题为准。</div></div>`;
  renderBlankNums();
}
function renderBlankNums(){
  const list=filteredItems();
  $('#blankNums').innerHTML=list.map((idx,i)=>{
    const on=i===blankPos?'on':'';
    const st=isMastered(curChapterId,idx)?'done':'';
    return `<button class="num ${on} ${st}" data-bp="${i}">${i+1}</button>`;
  }).join('');

/* ===== 默写题 ===== */
function renderRecall(){
  const list=filteredItems();
  $('#recallNums').innerHTML=list.map((idx,i)=>{
    const on=i===recallPos?'on':'';
    const st=isMastered(curChapterId,idx)?'done':'';
    return `<button class="num ${on} ${st}" data-rp="${i}">${i+1}</button>`;
  }).join('');
  if(!list.length){
    $('#recallCard').innerHTML=`<div class="empty">${filter==='miss'?'本章全部已掌握，无需再默写！':'本章暂无知识点。'}</div>`;
    return;
  }
  if(recallPos>=list.length)recallPos=0;
  const idx=list[recallPos];
  const item=curChapter().items[idx];
  const ansList=itemAns(item);
  let body='';
  ansList.forEach((a,i)=>{
    if(a.g&&(i===0||ansList[i-1].g!==a.g))body+=`<div class="group-title">${a.g}</div>`;
    body+=`<div class="recall-line"><span class="no">${i+1}.</span><input class="recall-input" data-i="${i}" placeholder="请输入该要点内容"></div>`;
  });
  $('#recallCard').innerHTML=`
    <div class="qhead">
      <span class="qtext">【${idx+1}】${item.q}</span>
      <span class="badge ${badgeCls(item.req)}">${item.req}</span>
    </div>
    <div class="hint">本题共 <b>${ansList.length}</b> 个知识点，请分行默写完整答案</div>
    <div class="recall-area">${body}</div>
    <div class="actions">
      <button class="btn primary" id="submitRecall">提交答案</button>
      <button class="btn ghost" id="showAnsRecall">显示答案</button>
      <button class="btn ghost" id="prevRecall">上一题</button>
      <button class="btn ghost" id="nextRecall">下一题</button>
    </div>
    <div id="recallResult"></div>`;
  $('#submitRecall').onclick=()=>judgeRecall();
  $('#showAnsRecall').onclick=()=>{
    $('#recallResult').innerHTML=`<div class="answer"><div class="t">正确答案：</div><ol>${ansList.map(a=>`<li>${a.t}</li>`).join('')}</ol></div>`;
  };
  $('#prevRecall').onclick=()=>{if(recallPos>0){recallPos--;renderRecall();}};
  $('#nextRecall').onclick=()=>{const list=filteredItems();if(recallPos<list.length-1){recallPos++;renderRecall();}};
}
function judgeRecall(){
  const list=filteredItems();
  const idx=list[recallPos];
  const item=curChapter().items[idx];
  const ansList=itemAns(item);
  let allOk=true,cnt=0;
  $('#recallCard').querySelectorAll('.recall-input').forEach(inp=>{
    const i=+inp.dataset.i;
    const ok=checkInput(inp.value,ansList[i].t,true);
    inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);
    if(ok)cnt++;else allOk=false;
  });
  $('#recallResult').innerHTML=`<div class="answer"><div class="t">${allOk?'全部默写正确，本知识点已掌握！':'默写正确 '+cnt+'/'+ansList.length+' 个，正确答案：'}</div><ol>${ansList.map((a,i)=>`<li>${a.t}</li>`).join('')}</ol></div>`;
  if(allOk)setMastered(curChapterId,idx,true);
  renderRecallNums();
}
function renderRecallNums(){
  const list=filteredItems();
  $('#recallNums').innerHTML=list.map((idx,i)=>{
    const on=i===recallPos?'on':'';
    const st=isMastered(curChapterId,idx)?'done':'';
    return `<button class="num ${on} ${st}" data-rp="${i}">${i+1}</button>`;
  }).join('');
}

/* ===== 汇总 ===== */
function renderSummary(){
  const cid=curChapterId,ch=curChapter();
  const gs=curGroupId*GROUP_SIZE,ge=Math.min(gs+GROUP_SIZE,ch.items.length);
  let total=ge-gs,mastered=0;
  for(let i=gs;i<ge;i++){if(isMastered(cid,i))mastered++;}
  const pct=total?Math.round(mastered/total*100):0;
  $('#summaryStats').innerHTML=`
    <div class="stat"><div class="v">${total}</div><div class="k">知识点总数</div></div>
    <div class="stat"><div class="v green">${mastered}</div><div class="k">已掌握</div></div>
    <div class="stat"><div class="v red">${total-mastered}</div><div class="k">未掌握</div></div>
    <div class="stat"><div class="v orange">${pct}%</div><div class="k">掌握率</div></div>`;
  $('#summaryList').innerHTML=ch.items.slice(gs,ge).map((it,i)=>{
    const idx=gs+i;
    const m=isMastered(cid,idx);
    const n=itemAns(it).length;
    return `<div class="summ-item"><span class="dot ${m?'ok':'no'}"></span>
      <span style="flex:1"><b>${idx+1}. ${it.q}</b> <span class="small-text">（${it.req} · ${n}个要点）</span></span>
      <span class="small-text" style="color:${m?'#16a34a':'#64748b'}">${m?'已掌握':'未掌握'}</span></div>`;
  }).join('');
}
function setMissThen(m){
  filter='miss';
  document.querySelectorAll('#filterSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f==='miss'));
  switchView(m);
}

/* ===== 卡片背记 ===== */
let cardChapterId=4;   // 当前背记章节
let cardGroupId=0;    // 当前背记分组
let cardReq='all';    // all / 必须背 / 重点背 / 尽量背
let cardPos=0;
let cardFlipped=false;

function cardChapter(){return CHAPTERS.find(c=>c.id===cardChapterId);}
function cardFilteredItems(){
  const ch=cardChapter();
  const s=cardGroupId*GROUP_SIZE,e=Math.min(s+GROUP_SIZE,ch.items.length);
  const list=[];
  for(let i=s;i<e;i++){
    if(cardReq==='all'||ch.items[i].req===cardReq)list.push(i);
  }
  return list;
}
function reqNumCls(req){return req==='必须背'?'n-must':(req==='重点背'?'n-key':'n-try');}
function hideAllViews(){
  ['homeView','chapterView','groupView','cardHomeView','cardStudyView','cardGroupView'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.style.display='none';
  });
}
function renderCardHome(){
  hideAllViews();
  $('#cardHomeView').style.display='';
  $('#cardChapterGrid').innerHTML=CHAPTERS.map(c=>{
    const n=c.items.length;
    return `<div class="card" data-ccid="${c.id}">
      <div class="ch-no">第${c.id}章</div>
      <div class="ch-title">${c.title}</div>
      <div class="cnt">共 ${n} 个知识点</div>
    </div>`;
  }).join('');
}
function renderCardGroups(){
  hideAllViews();
  $('#cardGroupView').style.display='';
  const ch=cardChapter();
  $('#cardGroupChTitle').textContent=ch.title+' · 选择分组';
  const numGroups=Math.ceil(ch.items.length/GROUP_SIZE);
  $('#cardGroupGrid').innerHTML=Array.from({length:numGroups},(_,g)=>{
    const s=g*GROUP_SIZE,e=Math.min(s+GROUP_SIZE,ch.items.length);
    return `<div class="card" data-cgid="${g}">
      <div class="ch-no">第${g+1}组</div>
      <div class="ch-title">知识点 ${s+1} ~ ${e}</div>
      <div class="cnt">共 ${e-s} 个知识点</div>
    </div>`;
  }).join('');
}
function renderCardStudy(){
  hideAllViews();
  $('#cardStudyView').style.display='';
  const ch=cardChapter();
  const gl=ch.items.length>GROUP_SIZE?` · 第${cardGroupId+1}组`:'';
  $('#cardChTitle').textContent=ch.title+gl;
  document.querySelectorAll('#cardReqSeg button').forEach(b=>b.classList.toggle('on',b.dataset.req===cardReq));
  const list=cardFilteredItems();
  $('#cardNums').innerHTML=list.map((idx,i)=>{
    const on=i===cardPos?'on':'';
    const rc=reqNumCls(cardChapter().items[idx].req);
    return `<button class="num ${on} ${rc}" data-cp="${i}">${i+1}</button>`;
  }).join('');
  if(!list.length){
    $('#flipCard').innerHTML=`<div class="empty">本章没有该类知识点。</div>`;
    return;
  }
  if(cardPos>=list.length)cardPos=0;
  const idx=list[cardPos];
  const item=cardChapter().items[idx];
  const ansList=itemAns(item);
  cardFlipped=false;
  $('#flipCard').innerHTML=`
    <div class="flip-card" id="flipCardInner">
      <div class="flip-inner" id="flipInner">
        <div class="flip-face flip-front">
          <span class="badge ${badgeCls(item.req)} card-badge">${item.req}</span>
          <div class="card-q">${item.q}</div>
          <div class="card-tip">点击卡片查看答案要点</div>
        </div>
        <div class="flip-face flip-back">
          <div class="card-q flip-back-q">${item.q}</div>
          <div class="card-ans">
            <div class="ans-title">答案要点（${ansList.length} 个）</div>
            <ol>${ansList.map(a=>`<li>${a.g?`<b>${a.g}：</b>`:''}${a.t}</li>`).join('')}</ol>
          </div>
          <div class="card-tip">点击卡片翻回问题</div>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button class="btn ghost" id="prevCard">← 上一张</button>
      <span class="small-text" id="cardPosText"></span>
      <button class="btn ghost" id="nextCard">下一张 →</button>
    </div>`;
  $('#flipCardInner').onclick=()=>{
    cardFlipped=!cardFlipped;
    $('#flipInner').classList.toggle('flipped',cardFlipped);
  };
  $('#prevCard').onclick=()=>{if(cardPos>0){cardPos--;renderCardStudy();}};
  $('#nextCard').onclick=()=>{const l=cardFilteredItems();if(cardPos<l.length-1){cardPos++;renderCardStudy();}};
  $('#cardPosText').textContent=`${cardPos+1} / ${list.length}`;
}

/* ===== 事件绑定 ===== */
$('#brandHome').onclick=()=>renderHome();
$('#backHome').onclick=()=>{if(curChapter().items.length>GROUP_SIZE)renderGroups();else renderHome();};
$('#chapterGrid').addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){curChapterId=+card.dataset.cid;curGroupId=0;if(curChapter().items.length>GROUP_SIZE)renderGroups();else renderChapter();}
});
$('#backFromGroup').onclick=()=>renderHome();
$('#groupGrid').addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){curGroupId=+card.dataset.gid;renderChapter();}
});
document.querySelector('.mode-tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(b)switchView(b.dataset.mode);
});
$('#filterSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(b)setFilter(b.dataset.f);
});
$('#blankNums').addEventListener('click',e=>{
  const b=e.target.closest('.num');if(!b)return;
  blankPos=+b.dataset.bp;blankCard=null;renderBlank();
});
$('#recallNums').addEventListener('click',e=>{
  const b=e.target.closest('.num');if(!b)return;
  recallPos=+b.dataset.rp;renderRecall();
});
$('#goMissBlank').onclick=()=>setMissThen('blank');
$('#goMissRecall').onclick=()=>setMissThen('recall');
$('#resetChBtn').onclick=()=>{
  const ch=curChapter();
  const label=ch.items.length>GROUP_SIZE?'本组':'本章';
  if(!confirm(`确定重置${label}全部掌握状态？`))return;
  const gs=curGroupId*GROUP_SIZE,ge=Math.min(gs+GROUP_SIZE,ch.items.length);
  if(!progress[curChapterId])progress[curChapterId]={};
  for(let i=gs;i<ge;i++)progress[curChapterId][i]=0;
  saveProgress(progress);
  renderSummary();renderHome();
};
/* 卡片背记入口与导航 */
$('#openCardHome').onclick=()=>renderCardHome();
$('#backCardHome').onclick=()=>{hideAllViews();$('#homeView').style.display='';};
$('#backCardCh').onclick=()=>{if(cardChapter().items.length>GROUP_SIZE)renderCardGroups();else renderCardHome();};
$('#cardChapterGrid').addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){cardChapterId=+card.dataset.ccid;cardReq='all';cardPos=0;cardFlipped=false;cardGroupId=0;
    if(cardChapter().items.length>GROUP_SIZE)renderCardGroups();else renderCardStudy();}
});
$('#backCardGroup').onclick=()=>renderCardHome();
$('#cardGroupGrid').addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){cardGroupId=+card.dataset.cgid;cardPos=0;cardFlipped=false;renderCardStudy();}
});
$('#cardReqSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  cardReq=b.dataset.req;cardPos=0;cardFlipped=false;renderCardStudy();
});
$('#cardNums').addEventListener('click',e=>{
  const b=e.target.closest('.num');if(!b)return;
  cardPos=+b.dataset.cp;cardFlipped=false;renderCardStudy();
});

renderHome();
</script>
</body>
</html>
